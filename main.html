<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest Hero Section</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Container -->
  <div class="hero">
    <!-- Image -->
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Mountain Lake Landscape" class="hero-image">
    
    <!-- Content / Text Box -->
    <div class="hero-content">
      <h1>Welcome to my<br>Pinterest clone</h1>
      <p>Discover new inspiration and save your favorite ideas</p>
      <a href="#" class="explore-btn">Explore now</a>
    </div>
  </div>

</body>
</html>
